name: Release

# Publishing a GitHub release publishes the gem. Release Drafter keeps a draft up to date as
# pull requests merge, so shipping is a matter of checking the notes and pressing publish.
#
# There is no API key anywhere. RubyGems trusted publishing signs for the gem, and it trusts
# this workflow in this repository and nothing else.
on:
  release:
    types: [published]
  # A release that failed on something unrelated should not need a second GitHub release to
  # ride in on.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # The suite runs again here rather than trusting the pull request's run, because what
      # ships is this commit, not the one that was reviewed.
      - run: bundle exec rspec
      - run: bundle exec rubocop --format github

      - name: Read the version from the gemspec
        id: version
        run: |
          version=$(ruby -e 'print Gem::Specification.load("payday.gemspec").version')
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      # The tag and the gemspec are written by hand at different times, so they can disagree.
      # Publishing either version would be wrong, and the wrong one is unrecoverable: RubyGems
      # does not let a version number be reused.
      - name: Check the release tag matches the gemspec
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ "${TAG#v}" != "${VERSION}" ]; then
            echo "Release tag ${TAG} does not match gemspec version ${VERSION}."
            echo "Fix whichever is wrong, then re-run this workflow."
            exit 1
          fi

      - name: Stop if this version is already published
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gem list --remote --exact webtranslateit-payday --all | grep -q "\b${VERSION}\b"; then
            echo "webtranslateit-payday ${VERSION} is already on RubyGems."
            exit 1
          fi

      # Exchanges this run's OIDC token for a short-lived RubyGems credential.
      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      # Not `rake release`, which is what rubygems/release-gem runs: that creates and pushes
      # the version tag, and publishing a GitHub release has already created it.
      - name: Build and push the gem
        run: |
          gem build payday.gemspec
          gem push "webtranslateit-payday-${{ steps.version.outputs.value }}.gem"

      - name: Wait for the release to propagate
        run: gem exec rubygems-await "webtranslateit-payday-${{ steps.version.outputs.value }}.gem"
